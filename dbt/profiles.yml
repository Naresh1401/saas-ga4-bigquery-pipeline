saas_ga4:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET', 'ga4_analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      timeout_seconds: 300
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET', 'ga4_analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 8
      timeout_seconds: 600
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
